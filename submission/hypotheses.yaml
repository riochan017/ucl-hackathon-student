# Ranked hypothesis set. M2 and M4 are statistically tied on the released data (raw BIC weights 0.57/0.43,
# deltaBIC 0.6), so the submitted weights are near-equal (0.50/0.47); the four rejected models get a
# small floor (0.0075 each), so the weights sum to 1.0.
ranking:
- model: M2
  weight: 0.50
  justification: Fits to within noise (chi2 155.0 on 181 points, 6 parameters). Its hidden intermediate
    I reproduces the ~0.10 M gap between B consumed and P+Q seen at all five temperatures. Inseparable
    from M4 on the released data (BIC difference 0.6, raw weights 0.57 vs 0.43).
- model: M4
  weight: 0.47
  justification: Equally good fit (chi2 155.6, 6 parameters) and the same intermediate mechanism as M2.
    It differs only in that Q forms from I + A. A stays between ~0.7 and 1.0 M in every released run,
    so this cannot be tested on the released data; low-A, high-B runs in the campaign can.
- model: M1
  weight: 0.0075
  justification: 'Structurally cannot hold B-derived material: B consumed always equals P+Q (checked by
    simulation, gap ~1e-16), but the data show a gap of ~0.10 M. Best chi2 ~5900 from random-start refits.
    Small non-zero weight only because the noise model and the candidate set are assumptions.'
- model: M5
  weight: 0.0075
  justification: Same bookkeeping failure as M1 (B consumed = P+Q at all times, no hidden species). Best
    chi2 ~5995, about 40 times worse than M2/M4. Small allowance for untested assumptions.
- model: M3
  weight: 0.0075
  justification: Same bookkeeping failure as M1 (B consumed = P+Q at all times, no hidden species). Best
    chi2 ~5999. Small allowance for untested assumptions.
- model: M6
  weight: 0.0075
  justification: B goes only into P, so B consumed equals P at all times, which contradicts the observed
    gap. Worst fit (best chi2 ~11,000). Small allowance for untested assumptions.
